name: New Student Local regression checks
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check docx-engine.js
          node --check cancel-letter.js
          node --check graduated-letter.js
          node --check criminal-record-letter.js
          node --check excel-export.js
          node --check ui-enhancements.js
          node --check sw.js
          node --check student-memory.js
      - name: Run generated-document and case-group regression checks
        run: |
          node tests/review-box-groups.test.cjs
          node --test tests/department-table.test.cjs
          node tests/hub-nationality.test.cjs
          node tests/cancel-letter.test.cjs
          node tests/graduated-letter.test.cjs
          node tests/criminal-record-letter.test.cjs
          node tests/letter-cases.test.cjs
          node tests/student-memory-contract.test.cjs
          node --test tests/student-memory-outbox.test.cjs
      - name: Install browser regression dependencies
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Exercise saved letter cases and Add student dialogs
        run: |
          python3 -m http.server 8124 --bind 127.0.0.1 > /tmp/letter-cases-http.log 2>&1 &
          sleep 2
          node tests/letter-case-dialogs-browser.mjs
      - name: Exercise editable department table and Excel output
        run: node tests/department-table-browser.mjs
      - name: Retain browser verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: letter-case-dialog-browser-results
          path: test-results/
          if-no-files-found: ignore
